plugins {
    id 'com.android.application'
}

android {
    namespace 'com.victory.powermenu'
    compileSdk 34

    defaultConfig {
        applicationId "com.victory.powermenu"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zero third-party dependencies: pure android.* SDK only.
dependencies {}
