plugins {
    id 'com.android.application'
}

android {
    namespace 'com.victory.powermenu'
    compileSdk 34

    defaultConfig {
        applicationId "com.victory.powermenu"
        minSdk 26
        // Kept at 31 for behaviour compatibility only. NOTE: this does NOT
        // bypass Android 13+ "restricted settings" — that gate follows how
        // the app was installed (APKs sideloaded outside an app store are
        // restricted regardless of targetSdk), so users must allow
        // restricted settings in App info before the accessibility service
        // can be turned on. See README. (We distribute via GitHub, not the
        // Play Store, which is the only place a targetSdk floor is enforced.)
        targetSdk 31
        versionCode 5
        versionName "1.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zero third-party dependencies: pure android.* SDK only.
dependencies {}
