plugins {
    id 'com.android.application'
}

android {
    namespace 'com.victory.powermenu'
    compileSdk 34

    defaultConfig {
        applicationId "com.victory.powermenu"
        minSdk 26
        // Deliberately below 33: Android 13+ blocks the accessibility service
        // for sideloaded apps ONLY when targetSdk >= 33 ("Restricted setting").
        // Targeting 31 sidesteps that block entirely, so the service can be
        // enabled normally. (We distribute via GitHub, not the Play Store,
        // which is the only place the targetSdk floor is enforced.)
        targetSdk 31
        versionCode 4
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zero third-party dependencies: pure android.* SDK only.
dependencies {}
